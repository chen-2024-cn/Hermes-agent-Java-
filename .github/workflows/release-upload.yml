name: Build and Upload Release Jar

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish (assets are never overwritten)'
        required: true
        default: 'v2.2.1'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version tag"; exit 1; }

      - name: Checkout version tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate version and release target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          version = ET.parse('Jhermes/pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text
          package = json.load(open('npm-package/package.json'))
          assert os.environ['TAG'] == 'v' + version, 'Tag and Maven version differ'
          assert package['version'] == version, 'npm and Maven versions differ'
          assert package['hermes']['jarUrl'] == f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{version}/hermes.jar", 'Download URL differs'
          PY
          if gh release view "$TAG" --json assets >/dev/null 2>&1; then
            COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
            [ "$COUNT" = 0 ] || { echo "Release already has assets; refusing overwrite"; exit 1; }
          fi

      - name: Build fat jar with tests
        run: |
          chmod +x Jhermes/mvnw
          ./Jhermes/mvnw -f Jhermes/pom.xml clean package -B

      - name: Stage and verify jar
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          VER="${TAG#v}"
          cp "Jhermes/target/Jhermes-$VER.jar" hermes.jar
          java -jar hermes.jar --version | tee version-output.txt
          grep -Fx "Jhermes $VER" version-output.txt
          sha256sum hermes.jar > hermes.jar.sha256
          stat -c 'jar bytes=%s' hermes.jar

      - name: Publish release without replacing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Jhermes $TAG" --generate-notes
          fi
          gh release upload "$TAG" hermes.jar hermes.jar.sha256
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json assets --jq '.assets[] | {name,size,state}'

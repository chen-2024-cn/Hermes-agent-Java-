name: Build and Upload Release Jar

# 手动触发：在云端 runner 上构建 hermes.jar 并上传到指定 Release tag。
# 用途：绕开本机到 uploads.github.com 的网络不稳定（大文件 connection reset），
#      由 runner（同区域访问 GitHub）秒传。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '目标 Release tag（已存在则上传资产，不存在则自动创建）'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write   # 上传 Release 资产必需

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # JH-SPEC-001 P0-1 R3：发布构建必须执行全部测试（去除 -DskipTests），
      # 测试失败直接中止，不得上传未验证产物。
      - name: Build fat jar (with tests)
        run: mvn -f Jhermes/pom.xml clean package -q

      - name: 复制为 hermes.jar 并核验版本与体积
        run: |
          # P0-1 R2：产物名与 tag 均由 pom 版本派生校验，杜绝三处版本漂移
          VER=$(mvn -f Jhermes/pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG="${{ github.event.inputs.tag }}"
          echo "pom version=$VER tag=$TAG"
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::tag($TAG) 与 pom 版本(v$VER)不一致，请先对齐再发布"; exit 1
          fi
          cp "Jhermes/target/Jhermes-$VER.jar" hermes.jar
          echo "jar size: $(du -h hermes.jar | cut -f1)"
          # 瘦身核验：非 win32 的 Playwright 驱动应已被 shade 排除，jar 应 ~45MB 而非 ~182MB
          SZ=$(stat -c%s hermes.jar)
          echo "bytes=$SZ"
          if [ "$SZ" -gt 120000000 ]; then echo "警告: jar 异常偏大，瘦身过滤器可能未生效"; fi

      - name: Upload to Release (创建或用已有 tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          # tag 不存在则先建（已存在时 gh release upload 直接复用）
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Jhermes $TAG" --generate-notes
          gh release upload "$TAG" hermes.jar --clobber
          echo "==== 上传后资产核验 ===="
          gh release view "$TAG" --json assets --jq '.assets[]|{name,size,state}'

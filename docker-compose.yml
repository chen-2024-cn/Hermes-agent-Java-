# ============================================================
#  Jhermes 一键环境部署
#
#  Jhermes 本体是交互式 CLI（npm 安装即可），唯一需要"环境"的
#  是 RAG 知识库依赖的 PostgreSQL + pgvector 向量数据库。
#  本文件将其容器化，解决启动时：
#    [WARN] PgVectorStore - RAG schema init failed:
#    Connection to localhost:5432 refused
#
#  用法（三选一）：
#    1. Docker Desktop (Windows):  docker compose up -d
#    2. WSL Ubuntu (已装 docker):  wsl -d Ubuntu -- docker compose up -d
#       （在仓库目录执行；或 tools\start-rag.ps1 自动探测两种方式）
#    3. 纯 Linux:                  docker compose up -d
#
#  账号/库名与 ~/.jhermes/config.yaml 的 rag.pgvector 段一致：
#    url:      jdbc:postgresql://localhost:5432/hermes_rag
#    username: hermes
#    password: hermes123
#
#  可覆盖变量（写进仓库根目录 .env 文件，或临时设环境变量）：
#    PG_PORT      宿主机映射端口，默认 5432；被占用时改成如 5433，
#                 记得同步改 config.yaml 的 rag.pgvector.url
#    PG_PASSWORD  容器密码，默认 hermes123，需与 config.yaml 一致
# ============================================================

services:
  pgvector:
    # 官方 pgvector 镜像（PostgreSQL 16 + vector 扩展预装）
    image: pgvector/pgvector:pg16
    container_name: hermes-pgvector
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${PG_PASSWORD:-hermes123}   # 与 config.yaml rag.pgvector.password 对齐
      POSTGRES_DB: hermes_rag
      # 中文文档入库时 to_tsvector 不受数据库编码影响，但显式 UTF-8 最稳
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${PG_PORT:-5432}:5432"        # 映射到宿主机，Java 侧 JDBC 直连；冲突时改 PG_PORT
    volumes:
      # 命名卷持久化：docker compose down 不丢索引数据；down -v 才会清除
      - hermes_pgdata:/var/lib/postgresql/data
      # 首次初始化（仅数据目录为空时执行）：预建 vector 扩展
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready 只认 TCP 可达；配合 hermes 用户/库名校验
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes_rag && psql -U hermes -d hermes_rag -tc \"SELECT 1 FROM pg_extension WHERE extname='vector'\" | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  hermes_pgdata:
    name: hermes_pgdata
